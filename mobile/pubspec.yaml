name: rovo_mobile
description: "ROVO road safety mobile application."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  flutter_blue_plus: 1.36.8
  sqflite: ^2.4.5
  path: ^1.9.1
  geolocator: ^14.1.2
  supabase_flutter: ^2.18.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.6

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/rovo_logo.jpeg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/rovo_logo.jpeg"
  remove_alpha_ios: true