; ICVSP device firmware.
;
; The device logic (lib/icvsp_core) is plain C++ with no hardware calls, so it builds and is unit-tested
; on a laptop with the `native` environment:
;     pio test -e native
;     pio run -e native && .pio/build/native/program      (demo: a synthetic drive)
;
; The board firmware is the ESP-IDF 5.5.5 project in ecu/ (same toolchain as espidf_security/ and the BLE
; project); it reuses lib/icvsp_core and lib/icvsp_board unchanged. See testing/hardware/ecu/BRINGUP_CHECKLIST.md.

[platformio]
default_envs = native

[env]
test_framework = unity

[env:native]
platform = native
build_flags = -std=c++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
