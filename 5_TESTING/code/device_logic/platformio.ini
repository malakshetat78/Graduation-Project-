; Laptop unit tests for the device logic in 1_XAIO_SW/code/components (signing, replay window, detectors,
; fusion, report queue, ECU app loop, NMEA parser, ...). They run on a computer, not on the board:
;     cd 5_TESTING/code/device_logic && pio test -e native
; PlatformIO is used only as a test runner here; the firmware itself is built with ESP-IDF.

[platformio]
default_envs = native
lib_dir = ../../../1_XAIO_SW/code/components

[env:native]
platform = native
test_framework = unity
lib_ldf_mode = chain
; only the plain C++ components; the ones that call ESP-IDF drivers (camera, IMU, GNSS UART, BLE) are left out
lib_ignore = icvsp_camera, icvsp_imu, icvsp_gnss, icvsp_ble
build_flags = -std=c++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE -I../../../1_XAIO_SW/code/main
