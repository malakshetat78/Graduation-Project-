# V-cycle verification on every push: unit, integration and traceability checks, plus the laptop tests of the firmware.
# Security scans (Gitleaks, Semgrep, Trivy) are added by the cybersecurity team (Gantt C2).
name: verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  tests:
    name: Unit + integration tests, traceability
    runs-on: ubuntu-latest
    services:
      supabase-db:   # throwaway database with PostGIS and the Supabase roles; migrations are applied by the tests
        image: supabase/postgres:17.11.0.003
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres -h 127.0.0.1"
          --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('5_TESTING/code/device_logic/platformio.ini') }}
      - name: Install tools
        run: pip install platformio coverage -r 3_WEB_SW/code/backend_sw/requirements.txt

      - name: Trust engine tests (unit, integration, system scenarios)
        working-directory: 3_WEB_SW/code/engine
        run: coverage run -m unittest -v 2>&1 | tee ../../../engine.log

      - name: Engine coverage
        working-directory: 3_WEB_SW/code/engine
        run: coverage report -m --include="icvsp/*" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Backend API tests (SQLite and Supabase PostgreSQL + PostGIS, RLS, concurrency, restarts)
        working-directory: 3_WEB_SW/code/backend_sw
        env:
          ICVSP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
        run: python -m unittest -v 2>&1 | tee ../../../backend.log

      - name: Device logic unit tests (the firmware's components, on the laptop)
        working-directory: 5_TESTING/code/device_logic
        run: pio test -e native -v | tee ../../../firmware.log

      - name: Hardware part laptop tests (camera JPEG check and log extractor, IMU calibration)
        run: |
          bash 5_TESTING/code/camera/run_host_tests.sh 2>&1 | tee hardware_host_tests.log
          c++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined -I 1_XAIO_SW/code/components/icvsp_imu \
            5_TESTING/code/imu/test_accel_cal.cpp 1_XAIO_SW/code/components/icvsp_imu/accel_cal.cpp -o /tmp/test_accel_cal
          /tmp/test_accel_cal 2>&1 | tee -a hardware_host_tests.log

      - name: Requirement traceability
        run: |
          python 5_TESTING/code/verification/check_traceability.py --unittest-log 3_WEB_SW/code/engine=engine.log \
            --unittest-log 3_WEB_SW/code/backend_sw=backend.log --firmware-log firmware.log \
            --out traceability_report.md
          cat traceability_report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            engine.log
            backend.log
            firmware.log
            hardware_host_tests.log
            traceability_report.md

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python (ruff, pyflakes rules)
        run: |
          pip install ruff
          ruff check --select F 3_WEB_SW/code/engine 3_WEB_SW/code/backend_sw 5_TESTING/code/verification 5_TESTING/code/camera
          ruff check --select E9,F63,F7,F82 4_AI_SW/code/scripts
      - name: C++ (cppcheck)
        # reported but not yet blocking: switched to blocking once the first report is clean
        continue-on-error: true
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q cppcheck
          cppcheck --std=c++17 --enable=warning,performance,portability --error-exitcode=1 --inline-suppr \
            --suppress=missingIncludeSystem -I 1_XAIO_SW/code/components/icvsp_core -I 1_XAIO_SW/code/components/icvsp_board \
            1_XAIO_SW/code/components/icvsp_core 1_XAIO_SW/code/components/icvsp_board
